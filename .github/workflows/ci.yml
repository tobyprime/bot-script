name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: 契约门禁（codegen / lua-sync / api-lint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 生成物与 manifest 一致（contract-lint）
        run: node tools/contract-lint.mjs
      - name: Lua 单一源（lua-sync）
        run: node tools/sync-lua.mjs --check

  engine:
    name: engine（契约向量 + 冒烟测试 + 包校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 全量测试（调度/持久化/策略/窗口/数据/HTTP/示例/驱动/向量）
        run: node testing/run.js
      - name: 包闸门（全部示例包：schema + Lua 编译 + API lint）
        run: |
          for d in examples/*/; do
            node engine/cli.js validate "$d" || exit 1
          done
