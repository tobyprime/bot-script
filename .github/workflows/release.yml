name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 创建引擎源码 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fabric mod 已归档（archive/fabric-mod），不再构建 jar；引擎以 git tag 被平台固定引用。
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
