# 整理 bot —— 脚本包清单（能力自述：跨服务器通用，DESIGN §6）
# 实例坐标不在包里：运行期经控制渠道（HTTP /params、param 命令、GUI）设置后持久化
name: organizer-1
scripts: [organizer.lua]
params:
  input:          { type: blockpos, required: true, visible: true, help: "待整理物品的输入箱" }
  stock_zone:     { type: region,   required: true, help: "库存/不满盒扫描区域" }
  partial_chests: { type: "list<blockpos>", default: [], visible: true, help: "手工登记的不满盒" }
  paused:         { type: boolean, default: false, visible: true, help: "暂停整理" }
  ops:            { type: string, default: "", visible: true, help: "控制命令运维名（逗号分隔；留空 = 不校验，示例用）" }
