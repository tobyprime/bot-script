# contracts/host-abi.yaml — 宿主 ABI v2（唯一真源）
#
# 四个入口：
#   核心→宿主 同步   __host_q(op, argsJson)                   → ResultJson
#   核心→宿主 异步   __host_a(op, argsJson)                   → token
#   宿主→核心 同步   __core_call(op, argsJson)                → {ok,result}|{ok:false,error}
#   宿主→核心 异步   __core_resume(id, resultJson, ctlJson) · __core_event(kind, payloadJson)
#
# 结果协议（v2.1）：
#   ResultJson = {"ok":true,"value":<any>} | {"ok":false,"error":{"code":"...","message":"..."}}
#   ctlJson    = {"cancel":"<source>"} | {"fail":{"kind":"...","detail":"..."}}
#   宿主绝不把 JS/运行时异常传入 Lua：确定性失败一律 Result；意外异常只记宿主日志，
#   Lua 侧最多看到稳定码 internal。取消是独立的控制通道，不是 error.code。
#
# v2 变更（破坏性）：
#   * 删除命令体系（command.declare / command.dispatch / on_command / 权威解析 / HTTP /cmd）
#   * data.item(id) → item.stack(stack)：堆叠数/攻击属性从 **ItemStack components** 读，不再按 id 猜
#   * 动作按「原版发什么包」建模：点击/挖掘/使用/交互/输入状态/视角，而不是按键操作；
#     删除 hop / move_input / use_item.duration / chat_reply / respawn
#   * 删除 protocol.tick_end 能力声明（那是对 mineflayer 的协议补丁，登记在 patches）
#   * 补全 self（药水效果/属性）、world（block_state / block_entity / time_of_day / weather / reach）、
#     实体全状态、ItemStack 组件与属性
#
# 规则：op/参数/gate/能力只在本文件声明；四份生成物由 tools/codegen.mjs 产出。

abi: 2

capabilities:
  nav.pathfinder:      { description: 真实寻路器可用；缺失时核心用 act.input + act.look 直线退化 }
  item.components:     { description: 宿主能读出 ItemStack components（Fabric 注册表 / Node 网络组件） }
  world.block_entity:  { description: 宿主能读出方块实体（方块 NBT/数据） }
  net.custom_payload:  { description: 宿主支持自定义网络包（custom payload / 插件消息）双向收发 }

# gate 类别 → 策略字段（policy.schema.json 以此为准）
# 策略默认开放：没有配置 = 不限制。只有显式写入的 boundary 字段才会收紧对应动作。
# 例外：packet 是显式授予位（boundary.packets=true/allow 才开放；缺省拒绝），
# 因为第三方插件通道属于扩展协议，不在常规动作门控的语义面内。
gates:
  chat:      { description: 发言（boundary.chat：say 限速/命令白名单/正则黑白名单；缺省不限） }
  move:      { description: 移动（boundary.allow_move=false 才禁止；fence 对移动目标生效） }
  combat:    { description: 攻击实体（boundary.combat.targets 设置后才限制目标 / max_engage） }
  dig:       { description: 开始挖掘（boundary.blocks.dig 显式拒绝才禁止）；停止挖掘不受门控 }
  place:     { description: 放置（boundary.blocks.place 显式拒绝才禁止），由 act.use_block.intent=place 触发 }
  container: { description: 容器访问（boundary.containers=false 才拒绝），作用于 window_open/click/close }
  packet:    { description: 自定义网络包（boundary.packets=true/allow 显式授予才开放；缺省拒绝），作用于 act.custom_payload 与 net.payload 事件 }

sync_ops:
  # ---------------- 基础设施 ----------------
  - name: log
    args: { level: { type: string, required: true }, msg: { type: string, required: true } }
    result: void
  - name: util.now
    args: {}
    result: number
  - name: util.regex_new
    args: { pattern: { type: string, required: true } }
    result: number
  - name: util.regex_match
    args: { id: { type: number, required: true }, text: { type: string, required: true } }
    result: object|null
  - name: token.bind
    args:
      task_id: { type: number, required: true }
      token: { type: number, required: true }
      kind: { type: string, required: true }
    result: void
  - name: token.detach
    args: { token: { type: number, required: true } }
    result: void
  - name: timer.after
    args: { delay: { type: number, required: true } }
    result: number
  - name: timer.interval
    args: { interval: { type: number, required: true } }
    result: number
  - name: events.emit
    args: { type: { type: string, required: true }, data: { type: object } }
    result: number
  - name: waiter.resolve
    args:
      token: { type: number, required: true }
      match: { type: string, required: true }
    result: void

  # ---------------- 自身 / 会话 ----------------
  - name: self.get
    args: {}
    result: Self|null
  - name: session.get
    args: {}
    result: SessionInfo
  - name: caps.get
    args: { flag: { type: string, required: true } }
    result: boolean
  - name: caps.list
    args: {}
    result: object                 # {flags:{宿主诊断}, patches:[{id,reason}], abi}

  # ---------------- 实体 ----------------
  - name: entities.list
    args:
      type: { type: string }       # 精确匹配 Entity.type（player / minecraft:zombie）
      within: { type: number }     # 与自身的 3D 距离上限（减少高频脚本的序列化量）
      pred: { type: object }       # 声明式谓词：name/uuid/alive/region/holding/equipment（宿主可下推）
      projection: { type: string, default: "full" }  # core = id/type/name/uuid/pos/alive + 装备 {id,count}
      order: { type: string }      # "distance" = 按与自身距离排序（配合 limit 做 top-K）
      limit: { type: number }      # 只返回前 limit 条（在宿主侧截断，不再全量过桥）
    result: Entity[]               # 注意：core 投影不展开装备组件（需要属性时用 item.stack 再读）
  - name: entities.get
    args:
      id: { type: string, required: true }
      projection: { type: string, default: "full" }  # core | full
    result: Entity|null

  # ---------------- 世界 / 方块 ----------------
  - name: world.block
    args: { pos: { type: blockpos, required: true } }
    result: Block|null             # {id, properties, state_id, hardness, block_entity?, is_container, stale}
  - name: world.block_entity
    args: { pos: { type: blockpos, required: true } }
    result: BlockEntity|null       # {type, data:object|null, snbt?: string}
  - name: world.scan
    args:
      region: { type: region, required: true }
      pred: { type: object }
      limit: { type: number, default: 200 }
    result: BlockPosInfo[]         # [{x,y,z,id}]
  - name: world.env
    args: {}
    result: WorldEnv               # {dimension, time_of_day, weather}
  - name: world.reach
    args:
      pos: { type: blockpos, required: true }
      max_distance: { type: number, default: 4.5 }
    result: ReachInfo               # {reachable, distance, hit_block?: id|null}

  # ---------------- 容器窗口 ----------------
  - name: window.current
    args: {}
    result: string|null
  - name: window.get
    args:
      window: { type: string, required: true }
      fields: { type: string, default: "full" }   # full | idcount；idcount = 只回 {id,count}（count/find 用，省序列化/解码）
    result: Window|null            # 槽位布局已归一化；'0' = 背包（容器打开时为玩家区合并视图）

  # ---------------- 物品栈（组件真值） ----------------
  - name: item.stack
    args: { stack: { type: object, required: true } }
    result: StackInfo              # {id,count,max_count,damage,max_damage,components?,attributes?,enchantments?,custom_name?}

  # ---------------- state（实例级 localStorage 语义；固定路径，包不可指定） ----------------
  # 语义：key -> JSON value；无 schema/查询/多键事务。单值 ≤16KB、总量 ≤256KB，
  # 超限以 state.quota 拒绝（不静默淘汰）。落盘合并由宿主负责（100ms + 停机 flush）。
  - name: state.get
    args: { key: { type: string, required: true } }
    result: any
  - name: state.all
    args: {}
    result: object                 # {key: value, ...}
  - name: state.set
    args:
      key: { type: string, required: true }
      value: { type: any }
    result: object                 # 成功 {}；超限 -> Result error code=state.quota
  - name: state.delete
    args: { key: { type: string, required: true } }
    result: object
  - name: state.seen
    args: { key: { type: string, required: true }, window_ms: { type: number, default: 5000 } }
    result: boolean                # true = 窗口内已见过（重复）


async_ops:
  # ---------------- 调度原语 ----------------
  - name: util.sleep
    args: { ms: { type: number, required: true } }
    result: void
  - name: events.next
    args: { timeout: { type: number, default: 30000 } }
    result: Event|null
  - name: waiter.new
    args: { timeout: { type: number, default: 5000 } }
    result: object|null

  # ---------------- 协议动作原语（按「发什么包」建模） ----------------
  - name: act.custom_payload
    gate: packet
    # 自定义网络包（原版 custom_payload / 插件消息，serverbound）
    # data 是 base64：Lua 侧 net.send 负责原始字节 ⇄ base64，避免二进制直接过 JSON。
    args:
      channel: { type: string, required: true }   # 资源位置，如 servux:metadata
      data: { type: string, default: "" }         # base64（空串 = 无载荷）
    result: object
  - name: act.chat_send
    gate: chat
    args:
      text: { type: string, required: true }
      kind: { type: string, default: chat }   # chat | command
    result: object
  - name: act.look
    args: { yaw: { type: number|null }, pitch: { type: number|null } }   # 度；一个 rotation 包
    result: object
  - name: act.input
    gate: move
    # 原版 player_input 的状态位（有符号轴映射 forward/backward、right/left）
    args:
      forward: { type: number, default: 0 }   # -1..1
      right: { type: number, default: 0 }     # -1..1
      up: { type: number, default: 0 }        # 0/1（跳跃位）
      sprint: { type: boolean, default: false }
      sneak: { type: boolean, default: false }
    result: object
  - name: act.path_to
    gate: move
    args:
      target: { type: blockpos, required: true }
      arrive: { type: number, default: 1.5 }
      timeout_ms: { type: number, default: 30000 }
    result: NavResult
  - name: act.path_cancel
    args: {}
    result: object
  - name: act.dig
    gate: dig
    # 发 player_action START 并持续进度直到破坏（与 act.dig_stop 成对）
    args:
      pos: { type: blockpos, required: true }
      face: { type: number, default: 1 }
    result: object
  - name: act.dig_stop
    args: {}
    result: object
  - name: act.use_block
    gate: place
    args:
      pos: { type: blockpos, required: true }
      face: { type: number, default: 1 }
      hand: { type: string, default: main }
      intent: { type: string, default: use }  # use | place（同一 interact 包；intent 只用于策略）
      cursor: { type: object }
    result: object
  - name: act.use_entity
    gate: combat
    args:
      id: { type: string, required: true }
      kind: { type: string, default: attack }  # attack | interact | interact_at
      target: { type: object }
      hand: { type: string, default: main }
    result: object
  - name: act.swing
    args: { hand: { type: string, default: main } }
    result: object
  - name: act.use_item
    args: { hand: { type: string, default: main }, phase: { type: string, default: start } }
    result: object
  - name: act.select_slot
    args: { slot: { type: number, required: true } }
    result: object
  - name: act.drop
    args: { slot: { type: number|null }, all: { type: boolean, default: false } }
    result: object
  - name: act.window_open
    gate: container
    args: { target: { type: any, required: true } }
    result: WindowRef
  - name: act.window_click
    gate: container
    args:
      window: { type: string, default: "0" }
      slot: { type: number, required: true }
      button: { type: number, default: 0 }
      mode: { type: number, default: 0 }
      state_id: { type: number|null }
    result: object
  - name: act.window_close
    gate: container
    args: { window: { type: string|null } }
    result: object

reverse_ops:
  - name: params.bind
    args: { manifest: { type: object }, instance: { type: object } }
    result: object                 # {schema, values}
  - name: params.get
    args: {}
    result: object                 # {schema, values}
  - name: params.set
    args: { key: { type: string, required: true }, value: { type: any } }
    result: object
  - name: tasks.list
    args: {}
    result: object[]
  - name: tasks.cancel
    args: { name: { type: string, required: true } }
    result: object                 # {ok, found}
  - name: eval.once
    args: { name: { type: string, required: true }, code: { type: string, required: true } }
    result: object                 # {ok, task}

models:
  Self:        "username, pos, yaw, pitch, health, food, gamemode, held:Stack|null, held_slot, velocity, pose, on_fire, sneaking, sprinting, effects:[{id,amplifier,duration}], attributes{armor,absorption,xp_level,xp_progress}"
  Entity:      "id, uuid, type, name, pos, velocity, yaw, pitch, health(null=不可见), effects[], equipment{hand,offhand,helmet,chestplate,leggings,boots}, pose, alive, flags{on_fire,sneaking,sprinting,invisible,glowing}, vehicle_id"
  Block:       "id, properties{...}, state_id, hardness, block_entity?:{type,data?,snbt?} , is_container, stale"
  BlockPosInfo: "x, y, z, id"
  ReachInfo:   "reachable, distance, hit_block(id|null)"
  Window:      "id, type, title, size, state_id, slots[{index,item:Stack|null}], cursor, revision"
  StackInfo:   "id, count, max_count, damage?, max_damage?, components?, attributes?, enchantments?, custom_name?"
  SessionInfo: "state, paused, pause_reason, info{version,brand,ping,players,view_distance,dimension}"
  WorldEnv:    "dimension, time_of_day, weather"
