# contracts/errors.yaml — 类型化错误清单（唯一真源）
#
# Lua 侧错误一律是 table：{ kind = "<本表之一>", detail = "<可读文案>"? }
# 宿主侧错误经 token 的 errJson 交付；HTTP 面按 category 映射状态码。
#
# category 语义（复用退出分类口径，ARCHITECTURE-REFACTOR §2.5）：
#   user       用户可自解（改配置 / 改脚本 / 补权限）
#   foreseeable 可预见的运行期状况（目标消失、容器关闭、限流、超时）
#   internal   平台/引擎内部问题（用户无需理解，进日志与追踪）
abi: 2

errors:
  # ---- ABI / 协议 ----
  abi.invalid_args:        { category: internal,    http: 400, description: 参数不符合 host-abi.yaml 声明 }
  abi.unknown_op:          { category: internal,    http: 400, description: 调用了清单未声明的 op }
  abi.reentrant_core_call: { category: internal,    http: 500, description: 核心→宿主帧内反向调核心（已排队，此为诊断） }

  # ---- 策略 / 授权 ----
  permission.denied:       { category: user,        http: 403, description: 未授权（观察模式 / 白名单 / 限速 / 预算） }
  policy.blocklist:        { category: user,        http: 403, description: 命中禁止项（dig/place/combat/移动开关） }

  # ---- 会话 ----
  session.bad_request:     { category: user,        http: 400, description: 会话凭据请求不合法 }
  session.offline:         { category: foreseeable, description: 宿主当前不在世界内（动作原语无法执行） }
  session.account_mode:    { category: user,        http: 409, description: 账号不是 auth=session 模式 }
  session.identity_mismatch: { category: user,      http: 409, description: 凭据身份与实例账号不匹配 }
  chat.offline:            { category: foreseeable, description: 会话不在 playing，无法发言 }
  chat.bad_request:        { category: user,        description: 发言内容不合法 }

  # ---- 世界 / 实体 / 容器 ----
  entity.gone:             { category: foreseeable, description: 目标实体已消失 }
  container.closed:        { category: foreseeable, description: 容器窗口已关闭 }
  container.missing:       { category: foreseeable, description: 目标容器打不开（不可达/无方块/服务器拒绝） }
  nav.unreachable:         { category: foreseeable, description: 目标不可达 }
  nav.unavailable:         { category: foreseeable, description: 宿主没有寻路器（capability nav.pathfinder=false） }
  nav.timeout:             { category: foreseeable, description: 寻路超时 }
  data.unknown:            { category: foreseeable, description: 宿主注册表没有该物品/方块 }

  # ---- 调度 / 运行期 ----
  runtime.paused:          { category: foreseeable, description: 暂停期间动作中止（resume 后在冻结点重抛） }
  timeout:                 { category: foreseeable, description: 组合子/动作超时 }
  task.cancelled:          { category: foreseeable, description: 任务被取消（协作式） }
  task.unknown:            { category: user,        description: 未声明的任务名 }
  guard.failed:            { category: foreseeable, description: guard 前置条件不满足 }
  action.unknown:          { category: internal,    description: 宿主没有该动作实现 }
  action.error:            { category: internal,    description: 动作实现抛出未分类异常 }
  driver.error:            { category: internal,    description: 驱动层异常 }
  event.bad_request:       { category: user,        description: events.emit 参数不合法 }

  # ---- persist / params ----
  persist.txn_yielded:     { category: user,        description: 事务体内出现挂起点（已回滚） }
  param.unknown:           { category: user,        description: 设置未声明的参数 }
  param.rejected:          { category: user,        description: 脚本校验钩拒绝该值 }
  params.readonly:         { category: user,        description: params 只能经控制总线修改 }
  params.validator_bad:    { category: user,        description: params_validator 注册形态不合法 }

  # ---- 包 ----
  lua.compile:             { category: user,        http: 400, description: Lua 编译失败 }
